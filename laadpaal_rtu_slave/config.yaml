name: "Laadpaal RTU-slave"
version: "1.0.8"
slug: "laadpaal_rtu_slave"
description: "Modbus RTU-slave die een Inepro N380 CT-meter emuleert voor de laadpaal, gevoed via MQTT"
url: "https://github.com/gvanhoecke/ha-laadpaal-addons"
arch:
  - aarch64
startup: services
boot: auto
init: false
usb: true
uart: true
devices:
  - /dev/ttyUSB0
apparmor: false
services:
  - mqtt:want
options:
  serial_port: "/dev/ttyUSB0"
  baudrate: 9600
  unit_id: 1
  mqtt_base_topic: "laadpaal/meter"
  monitored_keys: "voltage_l1,voltage_l2,voltage_l3,current_l1,current_l2,current_l3,active_power_total,active_power_l1,active_power_l2,active_power_l3,power_factor_l1,power_factor_l2,power_factor_l3"
schema:
  serial_port: str
  baudrate: int
  unit_id: int(1,247)
  mqtt_base_topic: str
  monitored_keys: str
